name: import-poc

on:
  push:
    paths:
      - .github/workflows/import-poc.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace the tree with the assembled monorepo
        run: |
          set -euo pipefail
          git clone --depth 1 --branch cursor/poc-monorepo-0938 \
            https://github.com/ToneKode/HackU-Time-Grocer.git /tmp/poc-src
          rsync -a --delete --exclude .git /tmp/poc-src/ ./
          git add -A
          if git diff --cached --quiet; then
            echo "tree already matches"
            exit 0
          fi
          git config user.name "Cursor Agent"
          git config user.email "cursoragent@cursor.com"
          git commit -m "Import the assembled HackU-Time-GrocerPoC tree."
          git push
